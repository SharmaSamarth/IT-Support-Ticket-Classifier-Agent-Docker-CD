name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ---------------------------------------------------------
  # JOB 1: Run the AI agent test suite
  # ---------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      # Dummy values only.
      # Tests use FakeLLMClient, so no real Gemini API call is made.
      GEMINI_API_KEY: dummy-test-key-not-real
      GEMINI_MODEL: gemini-3.6-flash

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run test suite
        run: |
          pytest tests/ -v \
            --cov=agent \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml


  # ---------------------------------------------------------
  # JOB 2: Build and smoke-test Docker image
  # ---------------------------------------------------------
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest

    # Docker build starts only if ALL tests pass
    needs: test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t it-support-classifier-agent:ci .

      - name: Smoke-test Docker image
        run: |
          docker run --rm \
            --entrypoint python \
            -e GEMINI_API_KEY=dummy-test-key-not-real \
            it-support-classifier-agent:ci \
            -c "import agent; print('agent module OK')"